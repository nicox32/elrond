# Construit l'APK Android et le publie dans une « Release » GitHub.
# Lien de téléchargement direct (dernière version) :
#   https://github.com/nicox32/elrond/releases/latest/download/elrond.apk
name: APK Android

on:
  push:
    branches: [ccr-de251d88-j0qjcp, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Tests et typage
        run: |
          npm test
          npm run typecheck

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk elrond.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elrond-apk
          path: elrond.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Elrond v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: elrond.apk
          body: |
            Appli de démonstration Elrond (compte adossé à l'or et à l'argent).
            Télécharge **elrond.apk** ci-dessous depuis ton téléphone Android pour l'installer.
