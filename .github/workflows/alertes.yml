# Serveur d'alertes Orvia : vérifie les cours toutes les 15 minutes et envoie les alertes par ntfy.
# Réglages (une fois) : secret NTFY_TOPIC = votre canal ntfy ; alertes dans server/alerts.json.
# Lancement manuel avec « test » coché : envoie une notification de test.
name: Alertes de prix

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer une notification de test'
        type: boolean
        default: false
      tout:
        description: 'Tester chaque alerte (une notification par alerte)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alertes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # L'état (relevés horaires, alertes déjà envoyées) passe d'une exécution à l'autre par le cache.
      - name: Récupérer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Vérifier les cours et envoyer les alertes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_TEST: ${{ inputs.test }}
          ALERT_TEST_ALL: ${{ inputs.tout }}
        run: node server/check-alerts.ts

      - name: Garder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
