# Diagnostic : cherche les flux d'actualités (RSS/Atom) des sites sur les métaux précieux et vérifie
# s'ils répondent (et autorisent l'accès navigateur, CORS). Lancement manuel.
name: Sources d'actualités

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.bullionvault.fr/gold-news https://www.bullionvault.com/gold-news https://www.aucoffre.com/actualites https://www.aucoffre.com/actualite https://www.aucoffre.com/blog https://www.aucoffre.com/sitemap.xml https://www.bullionvault.fr/sitemap.xml; do
            curl -sS -L -m 20 -A 'Mozilla/5.0' "$u" -o /tmp/p -w "=== $u -> %{http_code} %{url_effective}\n" || true
            grep -oiE '(href|src)="[^"]*(rss|feed|atom|\.xml)[^"]*"' /tmp/p | sort -u | head -8
            grep -oiE '<loc>[^<]*(news|actu|blog)[^<]*</loc>' /tmp/p | head -5
            grep -oiE 'href="[^"]*(gold-news|actualite)[^"]*/[^"]+"' /tmp/p | sort -u | head -5
          done
          for u in https://www.bullionvault.fr/gold-news/rss.xml https://www.bullionvault.com/gold-news/rss https://www.bullionvault.com/gold-news/feed https://www.bullionvault.fr/gold-news/feed https://www.aucoffre.com/rss.xml https://www.aucoffre.com/actualites/rss https://www.aucoffre.com/actualites.rss; do
            code=$(curl -sS -L -m 20 -o /tmp/b -w '%{http_code} %{content_type}' -A 'Mozilla/5.0' "$u" 2>&1 || true)
            echo "=== $u -> $code | items=$(grep -o '<item\|<entry' /tmp/b | wc -l)"
          done
