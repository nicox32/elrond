# Construit l'APK Android et le publie dans une « Release » GitHub.
# Lien de téléchargement direct (dernière version) :
#   https://github.com/nicox32/elrond/releases/latest/download/orvia.apk
name: APK Android

on:
  push:
    branches: [ccr-de251d88-j0qjcp, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Tests, typage et lint
        run: |
          npm test
          npm run typecheck
          npm run lint

      # Le numéro affiché dans l'appli (Profil) est celui de la release : 1.1.<numéro de construction>.
      - name: Numéro de version
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            c.expo.version = '1.1.${{ github.run_number }}';
            c.expo.android = { ...c.expo.android, versionCode: ${{ github.run_number }} };
            fs.writeFileSync('app.json', JSON.stringify(c, null, 2));
          "

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk orvia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orvia-apk
          path: orvia.apk

  # Démarrage vérifié sur un téléphone Android virtuel : sans succès, rien n'est publié.
  smoke:
    uses: ./.github/workflows/test-apk.yml

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orvia-apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Orvia v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: orvia.apk
          body: |
            Orvia : votre épargne en Gold Spot, argent et platine.
            Téléchargez **orvia.apk** ci-dessous depuis votre téléphone Android pour l'installer.
            Version testée au démarrage sur un téléphone Android virtuel avant publication.
