# Diagnostic : cherche les flux d'actualités (RSS/Atom) des sites sur les métaux précieux et vérifie
# s'ils répondent (et autorisent l'accès navigateur, CORS). Lancement manuel.
name: Sources d'actualités

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.loretlargent.info/feed/ https://loretlargent.info/feed/ \
            https://or.bullionvault.fr/gold-news/rss https://or.bullionvault.fr/gold-news https://or.bullionvault.fr/ \
            https://www.bullionvault.com/gold-news/rss.xml https://www.bullionvault.com/gold-news/news/rss https://www.bullionvault.com/gold-news/gold-price-news; do
            code=$(curl -sS -L -m 20 -o /tmp/b -D /tmp/h -w '%{http_code} %{content_type} %{url_effective}' -A 'Mozilla/5.0' -H 'Origin: https://nicox32.github.io' "$u" 2>&1 || true)
            cors=$(grep -i '^access-control-allow-origin' /tmp/h | tail -1 | tr -d '\r')
            echo "=== $u -> $code | items=$(grep -o '<item\|<entry' /tmp/b | wc -l) | ${cors:-pas de CORS}"
            grep -o '<title>[^<]*</title>' /tmp/b | head -3
            grep -oiE '(href)="[^"]*(rss|feed|atom)[^"]*"' /tmp/b | sort -u | head -5
            grep -oiE 'href="/gold-news/[a-z-]+/[^"]+"' /tmp/b | sort -u | head -4
            grep -oiE 'href="[^"]*(actualit|gold-news)[^"]*"' /tmp/b | sort -u | head -6
          done
