# Serveur d'alertes Orvia : vérifie les cours toutes les 15 minutes et envoie les alertes par ntfy.
# GitHub lance les tâches programmées avec beaucoup de retard (toutes les 4 à 7 h) : chaque lancement
# programmé tourne donc en boucle près de 6 h, avec une vérification toutes les 15 minutes ; le lancement
# suivant attend son tour, ce qui donne une surveillance continue.
# Réglages (une fois) : secret NTFY_TOPIC = votre canal ntfy ; alertes dans server/alerts.json (relu à chaque tour).
# Lancement manuel : une seule vérification (« test » coché : notification de test).
name: Alertes de prix

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer une notification de test'
        type: boolean
        default: false
      tout:
        description: 'Tester chaque alerte (une notification par alerte)'
        type: boolean
        default: false
      bot:
        description: 'Tester les notifications du bot d’achat (4 exemples)'
        type: boolean
        default: false
      boucle:
        description: 'Surveiller en continu (toutes les 15 min pendant 5 h 30)'
        type: boolean
        default: false

permissions:
  contents: read

# Une seule boucle à la fois ; un lancement manuel ne l'attend pas.
concurrency:
  group: alertes-${{ (github.event_name == 'schedule' || inputs.boucle) && 'boucle' || github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # L'état (relevés horaires, alertes déjà envoyées) passe d'une exécution à l'autre par le cache.
      - name: Récupérer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Vérifier les cours et envoyer les alertes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_TEST: ${{ inputs.test }}
          ALERT_TEST_ALL: ${{ inputs.tout }}
          ALERT_TEST_BOT: ${{ inputs.bot }}
          LOOP: ${{ github.event_name == 'schedule' || inputs.boucle }}
        run: |
          if [ "$LOOP" != "true" ]; then node server/check-alerts.ts; exit $?; fi
          # 22 tours de 15 minutes (5 h 30), sous la limite de durée de la tâche.
          for i in $(seq 1 22); do
            start=$(date +%s)
            git pull -q --ff-only || true
            node server/check-alerts.ts || echo "::warning::Tour $i en échec, nouvel essai dans 15 minutes"
            if [ "$i" -lt 22 ]; then sleep $(( 900 - ($(date +%s) - start) % 900 )); fi
          done

      - name: Garder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state
          key: alert-state-${{ github.run_id }}
