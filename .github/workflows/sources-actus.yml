# Diagnostic : cherche les flux d'actualités (RSS/Atom) des sites sur les métaux précieux et vérifie
# s'ils répondent (et autorisent l'accès navigateur, CORS). Lancement manuel.
name: Sources d'actualités

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://or.bullionvault.fr/actualites-de-l-or/rss https://or.bullionvault.fr/actualites-de-l-or/rss.xml https://or.bullionvault.fr/actualites-de-l-or/feed https://or.bullionvault.fr/actualites-de-l-or/news/rss https://or.bullionvault.fr/actualites-de-l-or/news https://or.bullionvault.fr/actualites-de-l-or; do
            code=$(curl -sS -L -m 20 -o /tmp/b -w '%{http_code} %{content_type}' -A 'Mozilla/5.0' "$u" 2>&1 || true)
            echo "=== $u -> $code | items=$(grep -o '<item\|<entry' /tmp/b | wc -l)"
            grep -oiE 'href="[^"]*(rss|feed)[^"]*"' /tmp/b | sort -u | head -4
            grep -oE '<a [^>]*href="/actualites-de-l-or/[a-z_]+/[^"]+"[^>]*>' /tmp/b | head -4
            grep -oE '<h[23][^>]*>[^<]{10,140}</h[23]>' /tmp/b | head -4
          done
          for u in https://or.bullionvault.fr/actualites-de-l-or/news; do curl -sS -L -m 20 -A 'Mozilla/5.0' "$u" -o /tmp/b; grep -n 'actualites-de-l-or/news/' /tmp/b | head -6 | cut -c1-400; done
